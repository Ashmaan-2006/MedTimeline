[project]
name = "medgraph-backend"
version = "0.1.0"
description = "FastAPI backend for MedGraph AI clinical timeline intelligence."
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4.0",
  "deepeval>=1.0.0",
  "fastapi>=0.115.0",
  "flower>=2.0.0",
  "kombu>=5.4.0",
  "langchain>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
  "langgraph>=0.2.0",
  "langsmith>=0.1.0",
  "neo4j>=5.28.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "pypdf>=6.0.0",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6.0",
  "ragas>=0.2.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0"
]

[tool.setuptools.packages.find]
include = ["medgraph_api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
